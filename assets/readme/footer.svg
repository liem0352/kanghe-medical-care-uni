<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 1200 100"
     role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">康禾 README 署名</title>
  <desc id="footerDesc">康禾智慧医养整合服务平台 README 页脚签名。中央展示 README MADE WITH 标识,左下为作者署名 liem 康禾医疗团队,右下为 MIT License © 2024。</desc>

  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2D2A"/>
      <stop offset="1" stop-color="#0B231F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="100" rx="18" fill="url(#footerBg)"/>

  <!-- 顶部分隔线 -->
  <line x1="56" y1="20" x2="1144" y2="20" stroke="#1F413B" stroke-width="1"/>

  <!-- 中央 README MADE WITH 标识 -->
  <text x="600" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3" fill="#E8B547">README MADE WITH</text>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#6B8682">康禾智慧医养整合服务 · uni-app · Vue 2</text>

  <!-- 底部分隔线 -->
  <line x1="56" y1="80" x2="1144" y2="80" stroke="#1F413B" stroke-width="1"/>

  <!-- 左下:作者 -->
  <text x="56" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.5" fill="#6B8682">作者 liem · 康禾医疗团队</text>

  <!-- 右下:License -->
  <text x="1144" y="94" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.5" fill="#6B8682">MIT License © 2024</text>
</svg>
