<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 1200 360"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">康禾页面架构</title>
  <desc id="archDesc">康禾智慧医养整合服务平台页面架构图。顶部为 4 个 tabBar 主入口:首页、医疗服务、家庭管理、我的。下方为 4 个次级页面:登录、健康监测、问诊详情、紧急求助。tabBar 卡片底部用虚线连接到次级页面,表示 uni-app navigateTo 路由关系。</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2D2A"/>
      <stop offset="1" stop-color="#0B231F"/>
    </linearGradient>
    <linearGradient id="archCardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A36"/>
      <stop offset="1" stop-color="#132D2A"/>
    </linearGradient>
    <marker id="archArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4FB3A5"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#archBg)"/>

  <!-- 章节标题 -->
  <text x="56" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E8E4D9">页面架构 · pages.json</text>
  <text x="1144" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.8" fill="#6B8682">8 PAGES · 4 TABBAR</text>
  <line x1="56" y1="58" x2="1144" y2="58" stroke="#1F413B" stroke-width="1"/>

  <!-- tabBar 分组标签 -->
  <text x="56" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#4FB3A5">tabBar 主入口</text>
  <text x="1144" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#6B8682">switchTab</text>

  <!-- tabBar 4 卡 -->
  <g id="tabbar-cards" transform="translate(56 96)">
    <!-- 卡 1: 首页 -->
    <g transform="translate(0 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 首页图标:屋形 -->
      <path d="M 20 44 L 38 28 L 56 44 V 60 H 20 Z" fill="none" stroke="#4FB3A5" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="34" y="48" width="10" height="12" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">首页</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/index</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">健康指标卡阵列</text>
    </g>
    <!-- 卡 2: 医疗服务 -->
    <g transform="translate(266 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 服务图标:医疗十字 -->
      <rect x="20" y="34" width="36" height="28" rx="5" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <path d="M 38 38 V 58 M 28 48 H 48" stroke="#4FB3A5" stroke-width="1.5" stroke-linecap="round"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">医疗服务</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/service</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">问诊 / 挂号 / 用药</text>
    </g>
    <!-- 卡 3: 家庭管理 -->
    <g transform="translate(532 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 家庭图标 -->
      <path d="M 20 44 L 38 28 L 56 44 V 60 H 20 Z" fill="none" stroke="#4FB3A5" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="32" y="46" width="10" height="14" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <rect x="46" y="46" width="6" height="6" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">家庭管理</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/family</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">成员 / 健康动态</text>
    </g>
    <!-- 卡 4: 我的 -->
    <g transform="translate(798 0)">
      <rect width="290" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 用户头像图标 -->
      <circle cx="38" cy="40" r="9" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <path d="M 24 60 Q 24 50 38 50 Q 52 50 52 60" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">我的</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/profile</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">档案 / 设置 / SOS 设置</text>
    </g>
  </g>

  <!-- 路由连线:tabBar 卡片底部 → 非 tabBar 卡片顶部 -->
  <g stroke="#4FB3A5" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.5">
    <path d="M 183 188 L 183 240"/>
    <path d="M 449 188 L 449 240"/>
    <path d="M 715 188 L 715 240"/>
    <path d="M 951 188 L 951 240"/>
  </g>

  <!-- 非 tabBar 分组标签 -->
  <text x="56" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#4FB3A5">次级页面</text>
  <text x="1144" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#6B8682">navigateTo · redirectTo</text>

  <!-- 非 tabBar 4 卡 -->
  <g id="sub-cards" transform="translate(56 240)">
    <!-- 卡 1: 登录 -->
    <g transform="translate(0 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 锁图标 -->
      <rect x="22" y="34" width="28" height="22" rx="3" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <path d="M 28 34 V 28 Q 28 22 36 22 Q 44 22 44 28 V 34" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">登录</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/login</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">权限分级 / 加密登录</text>
    </g>
    <!-- 卡 2: 健康监测 -->
    <g transform="translate(266 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 心电图标 -->
      <path d="M 20 48 H 32 L 36 36 L 42 58 L 48 30 L 54 58 L 58 48 H 70" fill="none" stroke="#4FB3A5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="88" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">健康监测</text>
      <text x="88" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/health</text>
      <text x="88" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">BMI / 报告 / 趋势</text>
    </g>
    <!-- 卡 3: 问诊详情 -->
    <g transform="translate(532 0)">
      <rect width="254" height="92" rx="12" fill="url(#archCardA)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 对话气泡图标 -->
      <path d="M 22 36 H 62 V 56 H 36 L 26 64 V 56 H 22 Z" fill="none" stroke="#4FB3A5" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="32" cy="46" r="1.5" fill="#4FB3A5"/>
      <circle cx="42" cy="46" r="1.5" fill="#4FB3A5"/>
      <circle cx="52" cy="46" r="1.5" fill="#4FB3A5"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">问诊详情</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4FB3A5">pages/detail</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">图文 / 视频 / 处方</text>
    </g>
    <!-- 卡 4: 紧急求助(琥珀强调) -->
    <g transform="translate(798 0)">
      <rect width="290" height="92" rx="12" fill="url(#archCardA)" stroke="#E8B547" stroke-width="1" stroke-opacity="0.55"/>
      <!-- SOS 图标 -->
      <circle cx="40" cy="44" r="18" fill="none" stroke="#E8B547" stroke-width="1.5"/>
      <path d="M 40 34 V 46 M 40 52 V 54" stroke="#E8B547" stroke-width="1.5" stroke-linecap="round"/>
      <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E8E4D9">紧急求助</text>
      <text x="76" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E8B547">pages/sos</text>
      <text x="76" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#6B8682">一键触发 · 位置共享</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <text x="600" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.5" fill="#6B8682">uni-app pages.json · tabBar 4 + subPackages</text>
</svg>
