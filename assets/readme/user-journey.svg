<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 1200 320"
     role="img" aria-labelledby="journeyTitle journeyDesc">
  <title id="journeyTitle">康禾用户旅程</title>
  <desc id="journeyDesc">康禾智慧医养用户五步主旅程:登录 → 健康档案 → 指标录入 → 趋势查看 → 就医问诊。前四步为日常监测循环(青松绿),第五步就医为异常触发转折(琥珀强调),由 utils/validator 阈值判断触发。</desc>

  <defs>
    <linearGradient id="journeyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2D2A"/>
      <stop offset="1" stop-color="#0B231F"/>
    </linearGradient>
    <linearGradient id="journeyCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A36"/>
      <stop offset="1" stop-color="#132D2A"/>
    </linearGradient>
    <marker id="journeyArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4FB3A5"/>
    </marker>
    <marker id="journeyArrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8B547"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#journeyBg)"/>

  <!-- 章节标题 -->
  <text x="56" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#E8E4D9">用户旅程 · user journey</text>
  <text x="1144" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.8" fill="#6B8682">5 STEPS · 日常循环 + 异常转诊</text>
  <line x1="56" y1="50" x2="1144" y2="50" stroke="#1F413B" stroke-width="1"/>

  <!-- 5 步卡片 + 4 箭头 -->
  <g transform="translate(66 70)">
    <!-- 步骤 1: 登录 -->
    <g transform="translate(0 0)">
      <rect width="196" height="156" rx="12" fill="url(#journeyCard)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 锁图标 -->
      <rect x="20" y="20" width="26" height="20" rx="3" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <path d="M 26 20 V 14 Q 26 8 33 8 Q 40 8 40 14 V 20" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E8E4D9">登录</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">权限分级</text>
      <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">数据加密</text>
      <text x="20" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4" fill="#4FB3A5">pages/login</text>
    </g>
    <!-- 箭头 1→2 -->
    <path d="M 200 148 H 218" fill="none" stroke="#4FB3A5" stroke-width="1.2" marker-end="url(#journeyArrow)"/>

    <!-- 步骤 2: 健康档案 -->
    <g transform="translate(222 0)">
      <rect width="196" height="156" rx="12" fill="url(#journeyCard)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 档案图标 -->
      <rect x="20" y="16" width="22" height="28" rx="2" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <line x1="24" y1="22" x2="38" y2="22" stroke="#4FB3A5" stroke-width="1.2"/>
      <line x1="24" y1="28" x2="38" y2="28" stroke="#4FB3A5" stroke-width="1.2"/>
      <line x1="24" y1="34" x2="34" y2="34" stroke="#4FB3A5" stroke-width="1.2"/>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E8E4D9">健康档案</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">基本信息录入</text>
      <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">既往病史</text>
      <text x="20" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4" fill="#4FB3A5">pages/profile</text>
    </g>
    <!-- 箭头 2→3 -->
    <path d="M 422 148 H 440" fill="none" stroke="#4FB3A5" stroke-width="1.2" marker-end="url(#journeyArrow)"/>

    <!-- 步骤 3: 指标录入 -->
    <g transform="translate(444 0)">
      <rect width="196" height="156" rx="12" fill="url(#journeyCard)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 录入图标:加号在方框中 -->
      <rect x="20" y="16" width="28" height="28" rx="3" fill="none" stroke="#4FB3A5" stroke-width="1.5"/>
      <path d="M 34 22 V 38 M 26 30 H 42" stroke="#4FB3A5" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E8E4D9">指标录入</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">血压 / 心率 / 血糖</text>
      <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">utils/validator</text>
      <text x="20" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4" fill="#4FB3A5">pages/health</text>
    </g>
    <!-- 箭头 3→4 -->
    <path d="M 644 148 H 662" fill="none" stroke="#4FB3A5" stroke-width="1.2" marker-end="url(#journeyArrow)"/>

    <!-- 步骤 4: 趋势查看 -->
    <g transform="translate(666 0)">
      <rect width="196" height="156" rx="12" fill="url(#journeyCard)" stroke="#2A4F4A" stroke-width="1"/>
      <!-- 折线图图标 -->
      <path d="M 18 44 L 26 36 L 34 40 L 42 28 L 50 32" fill="none" stroke="#4FB3A5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50" cy="32" r="1.8" fill="#4FB3A5"/>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E8E4D9">趋势查看</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">周 / 月 / 年报告</text>
      <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">异常即推送</text>
      <text x="20" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4" fill="#4FB3A5">services/scheduler</text>
    </g>
    <!-- 箭头 4→5:琥珀色(异常触发转折) -->
    <path d="M 866 148 H 884" fill="none" stroke="#E8B547" stroke-width="1.4" marker-end="url(#journeyArrowAmber)"/>
    <text x="875" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.4" fill="#E8B547">异常</text>

    <!-- 步骤 5: 就医(琥珀强调) -->
    <g transform="translate(888 0)">
      <rect width="196" height="156" rx="12" fill="url(#journeyCard)" stroke="#E8B547" stroke-width="1" stroke-opacity="0.6"/>
      <!-- 医生图标:十字 -->
      <rect x="20" y="16" width="28" height="28" rx="4" fill="none" stroke="#E8B547" stroke-width="1.5"/>
      <path d="M 34 22 V 38 M 26 30 H 42" stroke="#E8B547" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E8E4D9">就医问诊</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">图文 / 视频 / 挂号</text>
      <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">处方 / 用药管理</text>
      <text x="20" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.4" fill="#E8B547">pages/service</text>
    </g>
  </g>

  <!-- 底部说明:循环 + 转折 -->
  <g transform="translate(0 248)">
    <text x="56" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#6B8682">DAILY LOOP</text>
    <line x1="130" y1="10" x2="850" y2="10" stroke="#1F413B" stroke-width="1"/>
    <text x="866" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#E8B547">ESCALATE</text>
    <line x1="938" y1="10" x2="1144" y2="10" stroke="#E8B547" stroke-width="1" stroke-opacity="0.5"/>

    <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" fill="#9DB5B0">步骤 1-4 为日常监测循环,步骤 5 由 utils/validator 阈值判断触发转诊</text>
  </g>
</svg>
